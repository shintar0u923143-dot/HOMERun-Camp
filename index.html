<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#2E7D32" />
<title>HOMERun Camp</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#1f4d1c;overflow:hidden;font-family:Arial,Helvetica,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  #stage{position:relative;height:min(100vh,calc(100vw * 7 / 4));aspect-ratio:4/7;width:auto;max-width:100vw;overflow:hidden;container-type:size}
  #game{display:block;width:100%;height:100%;filter:saturate(1.22) contrast(1.08)}
  #vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 58%,rgba(10,30,10,.32) 100%)}
  .ui{position:absolute;pointer-events:none;color:#fff;font-weight:800}
  #hud{top:1.4%;left:2.5%;right:2.5%;height:7%;display:none;align-items:center;justify-content:space-between;padding:0 4%;
       background:rgba(0,0,0,.38);border-radius:14px;font-size:5cqw}
  #hud .c{color:#FFE27A}
  #bear{top:9.6%;left:2.5%;width:43%;height:3.2%;display:none;align-items:center;gap:6%;padding:0 3%;background:rgba(0,0,0,.38);border-radius:8px;font-size:2.8cqw}
  #bear i{flex:1;height:36%;background:#444;border-radius:6px;overflow:hidden}
  #bear b{display:block;height:100%;width:100%;background:#C6D62C;border-radius:6px}
  #boost{top:13.4%;left:2.5%;width:43%;height:3.2%;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.38);border-radius:8px;color:#C6D62C;font-size:2.8cqw}
  #popups{inset:0}
  .pop{position:absolute;left:50%;transform:translateX(-50%);font-size:5.5cqw;white-space:nowrap;text-shadow:0 0 4px #fff,0 0 8px #fff;animation:rise 1s ease-out forwards}
  @keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-10cqh}}
  #countdown{inset:0;display:none;align-items:center;justify-content:center;font-size:20cqw;color:#2E7D32;-webkit-text-stroke:2px #fff;text-shadow:0 4px 12px rgba(0,0,0,.25)}
  #pauseBtn{position:absolute;top:9.6%;right:2.5%;width:11%;aspect-ratio:1;margin:0;padding:0;border-radius:50%;
    background:rgba(0,0,0,.42);color:#fff;font-size:4cqw;font-weight:900;letter-spacing:-2px;box-shadow:none;border:2px solid rgba(255,255,255,.75);display:none;z-index:2;cursor:pointer}
  #pauseBtn:active{background:rgba(46,125,50,.8)}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,40,15,.45);z-index:3}
  #overlay.hidden{display:none}
  .card{background:#FFF8E7;color:#1B1B1B;border-radius:18px;padding:16px 16px 18px;width:88%;max-height:94%;overflow:auto;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .logo{font-weight:900;font-size:40px;letter-spacing:4px;color:#6DBE45;line-height:1;text-shadow:0 3px 0 #2E7D32}
  .sub{font-weight:800;font-size:16px;color:#2E7D32;letter-spacing:6px;margin:8px 0 10px}
  .how{font-size:13px;line-height:1.55;text-align:left;background:#fff;border-radius:12px;padding:8px 12px;margin:8px 0}
  input{width:100%;padding:11px;font-size:16px;border:2px solid #2E7D32;border-radius:10px;margin:6px 0;outline:none}
  .card button{width:100%;margin-top:8px;padding:12px;font-size:17px;font-weight:700;color:#fff;background:#6DBE45;border:0;border-radius:12px;cursor:pointer;box-shadow:0 4px 0 #2E7D32}
  .card button.alt{background:#2E7D32;box-shadow:0 4px 0 #1B4D1B}
  .card button:disabled{background:#bdbdbd;box-shadow:none;cursor:not-allowed}
  .board{margin-top:12px;text-align:left}
  .board b{display:block;text-align:center;margin-bottom:6px;color:#2E7D32}
  .row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:#fff;margin-bottom:4px;font-size:14px}
  .row .rk{width:24px;font-weight:800;color:#2E7D32}
  .row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .sc{font-weight:800}
  .gold{background:#FFE58A !important}.silver{background:#E6E6E6 !important}.bronze{background:#F2C7A0 !important}
  .me{outline:2px solid #2E7D32}
  .big{font-size:32px;font-weight:900;color:#2E7D32;margin:6px 0}
  .reason{color:#D32F2F;font-weight:700;margin-bottom:4px}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;background:#1f4d1c;z-index:4}
</style>

} }
</script>

function loadImages() {

const img = k => IMG[k] || null;

// ================= WORLD CONSTANTS (world units ~ metres) =================
const LANE_W = 1.6;
const laneX = l => (l - 1) * LANE_W;
const TW = 10.4;                 // ground tile width (the path is the middle half)
const L = TW * 2;                // ground tile length
const NCH = 9;                   // ground chunks kept alive ahead of the runner
const SPAWN_S = 140;             // how far ahead obstacles appear
const PH = 0.45;                 // runner half-depth for collisions
const GRAV = 30, JUMP_V = 10.5;  // jump apex ~1.84, ~0.7 s in the air
const HOLD = 1.25;               // a runner within this height of a roof edge can still grab on and climb up
const ROLL_TIME = 0.6;
const RUNNER_H = 1.9;
const HALL_X = 5.6, HALL_H = 4.4; // hallway half-width and ceiling height

// Stage loop, lengths in whole tiles so stage changes land on tile edges
const STAGES = [
  { id:'outdoor',  name:'CAMPSITE',         tiles:19 },
  { id:'house',    name:'INSIDE THE HOUSE', tiles:15 },
  { id:'backyard', name:'BACKYARD',         tiles:19 },
  { id:'outdoor',  name:'BACK TO CAMP',     tiles:19 }
];
STAGES.forEach(s => s.len = s.tiles * L);
const CYCLE = STAGES.reduce((a, s) => a + s.len, 0);
const BOUNDS = []; { let a = 0; for (const s of STAGES) { a += s.len; BOUNDS.push(a); } }
const wrap = (n, m) => ((n % m) + m) % m;
function stageAt(s) {
  let m = wrap(s, CYCLE);
  for (let i = 0; i < STAGES.length; i++) { if (m < STAGES[i].len) return { i, id: STAGES[i].id, local: m, end: STAGES[i].len - m }; m -= STAGES[i].len; }
  return { i: 0, id: 'outdoor', local: 0, end: STAGES[0].len };
}
const FOG = { outdoor: 0xD3E7E6, house: 0xF1E9DA, backyard: 0xDCEDEF };

// ================= RENDERER / SCENE =================
const canvas = document.getElementById('game');
const stageEl = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(FOG.outdoor, 70, 210);
scene.background = new THREE.Color(FOG.outdoor);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;   // glossy reflections
const camera = new THREE.PerspectiveCamera(62, 4 / 7, 0.1, 560);
const hemi = new THREE.HemisphereLight(0xEAF6FF, 0x5E7F44, 0.75);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xFFF0D2, 2.3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 34, bottom: -10, near: 1, far: 90 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
scene.add(sun); scene.add(sun.target);
const rim = new THREE.DirectionalLight(0xCFE8FF, 1.1);          // cool back light from ahead: bright edges on the camper and props
scene.add(rim); scene.add(rim.target);
// glow on bright things (coins, flames, lanterns, screens); dropped first if a phone struggles
let composer = null, bloomPass = null, useBloom = true;
try {
  composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: 4 }));
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.42, 0.5, 2.4);
  composer.addPass(bloomPass); composer.addPass(new OutputPass());
} catch (e) { useBloom = false; }
function resize() {
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); bloomPass.resolution.set(w / 2, h / 2); }
}
window.addEventListener('resize', resize);

// ================= TEXTURE HELPERS =================
const texCache = new Map();
function texFromImage(key, opts = {}) {
  const ck = key + JSON.stringify(opts);
  if (texCache.has(ck)) return texCache.get(ck);
  const t = new THREE.Texture(img(key));
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAX_ANISO; t.needsUpdate = true;
  if (opts.repeatX) { t.wrapS = THREE.RepeatWrapping; t.repeat.x = opts.repeatX; }
  texCache.set(ck, t);
  return t;
}
function canvasTex(w, h, draw, key, opts = {}) {
  if (key && texCache.has(key)) return texCache.get(key);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAX_ANISO;
  if (opts.wrap) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  if (key) texCache.set(key, t);

const CARD_H = { grill:1.3, tent:2.85, hammock:1.35, canopy:3.4, table:1.6, chair:1.45, cat:0.9, wagon:1.5, float:1.1, counter:1.6 };
function buildObstacle(type, o) {
  if (type === 'van') return BUILD.van(o.variant, o.half * 2, o.lad > 0);
  const key = (type === 'hammock' || type === 'canopy') ? null : (img(`obs-mid-lane-${type}`) ? `obs-mid-lane-${type}` : null);
  if (key && type === 'counter') {   // counter keeps its 3D length behind the picture
    const g = BUILD.counter(); const c = imageCard(key, CARD_H.counter); c.position.z = TYPES.counter.half + 0.05; g.add(c); return castShadows(g);
  }
  if (key) {
    const g = new THREE.Group(); const c = imageCard(key, CARD_H[type]); g.add(c);
    g.add(blobShadow(c.userData.w * 0.42, 0.6));
    if (type === 'float') g.userData.bob = c;

}

    const tr = at(cyl(0.14, 0.22, h * 0.5, fmat('trunk', 0x6B4A2E), 7), 0, h * 0.25, 0); g.add(tr);
    for (const [x, y, z, r] of [[0, 0.68, 0, 0.3], [-0.2, 0.58, 0.1, 0.22], [0.22, 0.6, -0.05, 0.24], [0.05, 0.84, 0.05, 0.2]]) g.add(at(ico(r * h, lm), x * h, y * h, z * h));

const KEY_SCORES = 'homer-camp-run-scores', KEY_NAME = 'homer-camp-run-name';

function saveScore(name, pts, atT) {
  const all = loadScores(); all.push({ name, score: pts, at: atT }); all.sort((a, b) => b.score - a.score);
  safeSet(KEY_SCORES, JSON.stringify(all.slice(0, 10)));
  const i = all.findIndex(e => e.at === atT); return (i >= 0 && i < 10) ? i + 1 : null;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

// ---- actions ----
function jump() { if (!player.airborne) { player.roll = 0; player.airborne = true; player.vh = JUMP_V; pickHatMode(false); } }   // jumping cancels a roll
function rollDown() {
  if (player.airborne) { player.vh = Math.min(player.vh, -18); player.roll = ROLL_TIME; pickHatMode(true); return; }   // slam down like Subway Surfers
  if (player.roll <= 0) { pickHatMode(true); dustBurst(5, player.xw, dist, player.h); } player.roll = ROLL_TIME;
}

function rampFloor(o, rel) {

  if (rel > o.half) return { h: o.top * (1 - (rel - o.half) / o.lad), kind: 'ladder', o };

}
function floorAt(lane) {

    const f = rampFloor(o, o.s - dist);
    if (f && (!best || f.h > best.h)) best = f;
  }

}

  const f = floorAt(t);

  else if (k === 'ArrowDown' || k === 's' || k === 'S') rollDown();
  else return;
  e.preventDefault();
});
pauseBtn.addEventListener('pointerdown', e => e.stopPropagation());
pauseBtn.addEventListener('pointerup', e => e.stopPropagation());
pauseBtn.addEventListener('click', e => { e.stopPropagation(); pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

// ---- screens ----
function setPlayUI(on) { hud.style.display = on ? 'flex' : 'none'; pauseBtn.style.display = on ? 'block' : 'none'; if (!on) { bearUI.style.display = 'none'; boostUI.style.display = 'none'; } }
function startGame() { reset(); state = 'play'; overlay.classList.add('hidden'); setPlayUI(true); popup('RUN!', '#2E7D32'); }
function showTitle() {
  state = 'title'; setPlayUI(false); overlay.classList.remove('hidden');
  if (player) clearObjects();
  idleDist = dist;
  card.innerHTML = `
    <div class="logo" style="font-size:38px">HOMERun</div><div class="sub">CAMP</div>
    <div class="how"><b>How to play</b><br>
      &bull; Swipe left / right to change lanes<br>
      &bull; Swipe up to jump the BBQ grill, chairs, the cat and the hammock<br>
      &bull; Swipe down to roll under the tent, the table and the hammock<br>
      &bull; Climb the ladder onto the camper van (or hop onto a counter) and run along the top<br>
      &bull; Grab the wagon for a speed boost<br>
      &bull; Swiping right into a counter or van brings the bear<br>
      &bull; Collect the HOMER leaf coins. One life. Three close calls and the bear catches you!
    </div>
    <input id="pname" maxlength="16" placeholder="Enter your name" value="${esc(playerName)}" />
    <button id="startBtn" ${playerName.trim() ? '' : 'disabled'}>START RUN</button>
    <div class="board"><b>Top 10 Scoreboard</b>${boardHTML(null)}</div>`;
  const inp = card.querySelector('#pname'), btn = card.querySelector('#startBtn');
  const go = () => { const n = inp.value.trim(); if (!n) return; playerName = n; safeSet(KEY_NAME, n); startGame(); };
  inp.addEventListener('input', () => { btn.disabled = !inp.value.trim(); });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  btn.addEventListener('click', go);
}
function showOver() {
  const atT = Date.now(), pts = score(), rank = saveScore(playerName, pts, atT);
  setPlayUI(false); overlay.classList.remove('hidden');
  card.innerHTML = `<div class="logo" style="font-size:30px">GAME OVER</div><div class="reason">${esc(deathReason)}</div>
    <div class="big">${pts}</div><div>${esc(playerName)} &middot; ${rank ? 'You placed #' + rank + '!' : 'Keep running to reach the Top 10!'}</div>
    <button id="againBtn">PLAY AGAIN</button><button id="newBtn" class="alt">NEW PLAYER</button>
    <div class="board"><b>Top 10 Scoreboard</b>${boardHTML(atT)}</div>`;
  card.querySelector('#againBtn').onclick = startGame; card.querySelector('#newBtn').onclick = showTitle;
}
function pauseGame() {
  if (state !== 'play') return;
  state = 'paused'; setPlayUI(false); overlay.classList.remove('hidden');
  card.innerHTML = `<div class="logo" style="font-size:30px">PAUSED</div><div class="big">${score()}</div>
    <div>${Math.floor(dist * 0.5)} m &middot; ${coinCount} coins</div>
    <button id="resumeBtn">RESUME</button><button id="restartBtn" class="alt">RESTART</button><button id="quitBtn" class="alt">QUIT TO MENU</button>`;
  card.querySelector('#resumeBtn').onclick = resumeGame; card.querySelector('#restartBtn').onclick = startGame; card.querySelector('#quitBtn').onclick = showTitle;
}
function resumeGame() { if (state !== 'paused') return; state = 'play'; overlay.classList.add('hidden'); setPlayUI(true); countdown = 1.5; lastTs = 0; }
function die(reason) {
  if (state !== 'play' || window.__god) return;
  state = 'over'; deathReason = reason; shake = 0.5; setTimeout(showOver, 450);
}
function bearAppear() { lastNear = time; bearD = Math.max(0, bearD - 0.34); shake = 0.25; popup('BEAR!', '#D32F2F', 62); if (bearD <= 0) die('The bear caught you!'); }
function nearMiss() { bonus += 50; popup('CLOSE CALL!', '#8FA81E', 56); bearAppear(); }

// ---- spawning ----
function nearBoundary(s) {
  const m = wrap(s, CYCLE);
  if (m < 14) return true;
  for (let i = 0; i < BOUNDS.length; i++) if (m > BOUNDS[i] - 30 && m < BOUNDS[i] + 14) return true;
  return false;
}
function addObstacle(type, lane, s, opts = {}) {
  const T = TYPES[type];
  const o = { type, lane, s, half: opts.half || T.half, top: opts.top || T.top, lad: opts.lad !== undefined ? opts.lad : (T.lad || 0), variant: opts.variant || 0, mesh: null, done: false, tight: false, bonus: false, used: false };
  o.mesh = buildObstacle(type, o); world.add(o.mesh);
  obstacles.push(o); addCoinsOn(o); return o;
}
function addCoin(lane, s, h) { const mesh = buildCoin(); world.add(mesh); coins.push({ lane, s, h, mesh, got: false }); }
function trainFits(s, len) { for (let d = -4; d <= len + 14; d += 6) if (nearBoundary(s + d) || inPool(s + d)) return false; return true; }
// a train of 1-3 camper vans in one lane, gaps small enough to jump (or just run) across
function addVanTrain(lane, s) {
  let n = dist < 120 ? 1 : 1 + (Math.random() < 0.5 ? 1 : 0) + (Math.random() < 0.25 ? 1 : 0);
  const halves = []; for (let i = 0; i < n; i++) halves.push(6 + Math.random() * 2.5);
  const gaps = []; for (let i = 1; i < n; i++) gaps.push(2.2 + Math.random() * 0.7);
  const total = () => halves.slice(0, n).reduce((a, h) => a + 2 * h, 0) + gaps.slice(0, n - 1).reduce((a, g) => a + g, 0) + VANS[0].lad;
  while (n > 1 && !trainFits(s, total())) n--;
  if (!trainFits(s, total())) return 0;
  const v0 = Math.floor(Math.random() * VANS.length);
  let cur = s + VANS[v0].lad;    // leave room for the first ladder
  let prev = null;
  for (let i = 0; i < n; i++) {
    const v = i === 0 ? v0 : 1 + ((v0 + i) % (VANS.length - 1));
    const V = VANS[v], half = halves[i];
    const o = addObstacle('van', lane, cur + half, { half, top: V.top, lad: i === 0 ? V.lad : 0, variant: v });
    if (prev) for (let k = 1; k <= 3; k++) addCoin(lane, prev.s + prev.half + gaps[i - 1] * k / 4, V.top + 0.7 + Math.sin(k / 4 * Math.PI) * 0.7);
    prev = o; cur = o.s + half + (gaps[i] || 0);
  }
  return cur - s;
}
// place one row of obstacles at s; returns how far (m) it reaches past s
function spawnRow(s) {
  if (nearBoundary(s)) { for (let k = 0; k < 5; k++) addCoin(1, s + k * 2.4, 0); return 12; }
  const pool = inPool(s) ? ['float', 'float'] : POOLS[stageAt(s).id];
  if (!inPool(s) && (inPool(s + 12) || inPool(s - 12))) { for (let k = 0; k < 5; k++) addCoin(1, s + k * 2.4, 0); return 12; }
  const lanes = [0, 1, 2].sort(() => Math.random() - 0.5);
  const count = (dist > 300 && Math.random() < 0.35) ? 2 : 1;
  const used = []; let ext = 1.5;
  for (let i = 0; i < count; i++) {
    const type = pool[Math.floor(Math.random() * pool.length)];
    if (type === 'van') {
      const e = addVanTrain(lanes[i], s);
      if (e > 0) { used.push(lanes[i]); ext = Math.max(ext, e); continue; }
      addObstacle('grill', lanes[i], s); used.push(lanes[i]); continue;
    }
    const o = addObstacle(type, lanes[i], s); used.push(lanes[i]); ext = Math.max(ext, o.half * 2);
  }
  const free = [0, 1, 2].filter(l => !used.includes(l));
  if (free.length && Math.random() < 0.6) { const l = free[Math.floor(Math.random() * free.length)]; for (let k = 0; k < 6; k++) addCoin(l, s + k * 2.2, 0); }
  return ext;
}
function addCoinsOn(o) {
  const T = TYPES[o.type];
  switch (o.type) {
    case 'grill': case 'hammock': case 'cat': case 'chair':
      for (let j = -3; j <= 3; j++) addCoin(o.lane, o.s + j * 1.1, 1.75 - j * j * 0.11); break;
    case 'tent': case 'table':
      for (let j = -2; j <= 2; j++) addCoin(o.lane, o.s + j * 1.1, 0.5); break;
    case 'van': case 'counter': {
      const n = Math.max(5, Math.floor(o.half * 2 / 2.4));
      for (let j = 0; j < n; j++) addCoin(o.lane, o.s - o.half + 1 + j * (o.half * 2 - 2) / (n - 1), o.top + 0.5);
      break;
    }
    case 'float':
      for (let j = -3; j <= 3; j++) addCoin(o.lane, o.s + j * 1.1, 1.6 - j * j * 0.1); break;
    case 'canopy': case 'wagon':
      for (let j = -2; j <= 2; j++) addCoin(o.lane, o.s + j * 1.3, 0.5); break;
  }
}

// ================= UPDATE =================
function update(dt) {
  time += dt;
  if (boostT > 0) boostT = Math.max(0, boostT - dt);
  speed = Math.min(26, 12 + dist * 0.008) * (boostT > 0 ? 1.5 : 1);
  const travel = speed * dt;
  dist += travel;

  const si = stageAt(dist);
  if (si.i !== lastStage) { lastStage = si.i; popup(STAGES[si.i].name, '#2E7D32', 30); }

  // runner physics: gravity, then the floor under the runner (ground, ladder or roof)
  player.climb = false;
  const f0 = floorAt(player.lane), fh = f0 ? f0.h : 0, onRoof = f0 && f0.kind === 'roof';
  if (!player.airborne && fh < player.h - 0.02) { player.airborne = true; player.vh = 0; }      // ran off the end of a roof
  if (player.airborne) { player.vh -= GRAV * dt; player.h += player.vh * dt; }
  if (onRoof && player.h < fh - 0.001) {
    if (player.lift || player.ladder || player.h >= fh - HOLD) {                                 // grab the edge and climb up
      player.h = Math.min(fh, player.h + 14 * dt); player.vh = 0; player.airborne = false; player.climb = true;
      if (player.h >= fh) player.lift = false;
    } else { die(REASON[f0.o.type]); if (state !== 'play') return; }
  } else if (player.airborne) {
    if (player.h <= fh && player.vh <= 0) { player.h = fh; player.vh = 0; player.airborne = false; }
  } else {
    player.h = fh;
    if (f0 && f0.kind === 'ladder') player.climb = true;
  }
  player.ladder = !!(f0 && f0.kind === 'ladder' && !player.airborne);
  player.onRamp = fh > 0 && !player.airborne;
  if (player.roll > 0) player.roll = Math.max(0, player.roll - dt);
  player.xw += (laneX(player.lane) - player.xw) * Math.min(1, dt * 14);
  // squash and stretch hooks for the runner sprite
  if (player.wasAir && !player.airborne) { player.sq = 0.14; camKick = 0.16; if (!inPool(dist)) dustBurst(7, player.xw, dist, player.h); }
  player.wasAir = player.airborne;
  if (player.sq > 0) player.sq = Math.max(0, player.sq - dt * 0.9);

  while (nextS < dist + SPAWN_S) { if (nextS < dist) nextS = dist + 30; nextS += spawnRow(nextS) + Math.max(14, 20 + Math.random() * 8 - dist * 0.008); }

  for (const o of obstacles) {
    const T = TYPES[o.type], rel = o.s - dist;
    const inZ = Math.abs(rel) < o.half + PH;
    if (inZ && o.lane === player.lane && !o.done && T.kind !== 'ramp') {
      if (T.kind === 'pass') {
        if (!o.bonus) { o.bonus = true; bonus += 25; popup('SHADE +25', '#2E7D32', 66); }
      } else if (T.kind === 'boost') {
        if (!o.used) { o.used = true; boostT = 4; bonus += 30; popup('SPEED UP!', '#8FA81E', 58); o.mesh.visible = false; }
      } else {
        const okay = T.kind === 'jump' ? player.h >= T.clear : T.kind === 'roll' ? player.roll > 0 : (player.h >= T.clear || player.roll > 0);
        if (!okay) { die(REASON[o.type]); if (state !== 'play') return; }
        if (T.kind === 'jump' && player.h - T.clear < 0.2) o.tight = true;
        if (T.kind === 'roll' && player.roll < 0.15) o.tight = true;
        if (T.kind === 'both' && ((player.h >= T.clear && player.h - T.clear < 0.2) || (player.roll > 0 && player.roll < 0.15))) o.tight = true;
      }
    }
    if (!o.done && rel < -(o.half + PH)) { o.done = true; if (T.lethal && o.tight) { nearMiss(); if (state !== 'play') return; } }
  }

  for (const c of coins) {
    if (!c.got && c.lane === player.lane && Math.abs(c.s - dist) < 0.7 && Math.abs(c.h - player.h) < 1.0) {
      c.got = true; coinCount++; bonus += 10; c.mesh.visible = false; sparkle(laneX(c.lane), c.s, c.h + 0.45);
    }
  }
  obstacles = obstacles.filter(o => { const keep = o.s + o.half - dist > -14; if (!keep) world.remove(o.mesh); return keep; });
  coins = coins.filter(c => { const keep = !c.got && c.s - dist > -8; if (!keep) world.remove(c.mesh); return keep; });

  if (time - lastNear > 2.5) bearD = Math.min(1, bearD + dt * 0.12);
}

// ================= SYNC SCENE TO STATE =================
const fogCol = new THREE.Color(FOG.outdoor), tmpCol = new THREE.Color();
function syncScene(dt, viewDist) {
  // ground chunks: recycle the ones behind the camera to the front
  for (let i = 0; i < chunks.length; i++) {
    const c = chunks[i];
    if ((c.userData.n + 1) * L < viewDist - 14) {
      world.remove(c); disposeChunk(c);
      const maxN = Math.max(...chunks.map(k => k.userData.n));
      const nc = buildChunk(maxN + 1); world.add(nc); chunks[i] = nc;
    }
  }
  for (const c of chunks) c.position.z = -(c.userData.n * L - viewDist);
  for (const o of obstacles) {
    o.mesh.position.set(laneX(o.lane), 0, -(o.s - viewDist));
    if (o.type === 'wagon' && o.mesh.userData.ring) o.mesh.userData.ring.material.opacity = 0.5 + 0.4 * Math.sin(time * 8);
  }
  for (const c of coins) { c.mesh.visible = !c.got && c.s - viewDist > -0.8; c.mesh.position.set(laneX(c.lane), c.h + 0.45, -(c.s - viewDist)); c.mesh.rotation.y = time * 3 + c.s; }

  // runner
  const swimming = state !== 'title' && inPool(viewDist);
  const sink = swimming ? (player.roll > 0 ? 1.9 : (player.airborne ? 0 : 0.95)) : 0;
  runner.position.set(player.xw, player.h - sink, 0);
  setRunnerPose(dt);
  const sh = runner.userData.shadow, splash = runner.userData.splash;
  const floorH = rampUnder();
  sh.visible = !swimming;
  sh.position.y = 0.04 + floorH - player.h;
  const ss = Math.max(0.4, 1 - (player.h - floorH) / 4); sh.scale.set(0.55 * ss, 0.35 * ss, 1);
  splash.visible = swimming && !player.airborne && player.roll <= 0;
  if (splash.visible) { splash.position.y = sink - 0.1; const k = 1 + 0.15 * Math.sin(time * 12); splash.scale.set(k, k, 1); }
  if (waterTex) { waterTex.offset.y = (waterTex.offset.y + dt * 0.12) % 1; waterTex.offset.x = Math.sin(time * 0.7) * 0.03; }
  for (const o of obstacles) if (o.mesh.userData.bob) o.mesh.userData.bob.position.y = (o.type === 'float' && o.mesh.userData.bob.isMesh && o.mesh.userData.bob.geometry.type === 'TorusGeometry' ? 0.15 : -0.35) + Math.sin(time * 3 + o.s) * 0.08;
  volleyBalls.forEach((b, i) => { const t = (time * 0.55 + i * 0.3) % 1, dir = Math.floor(time * 0.55 + i * 0.3) % 2; const u = dir ? t : 1 - t; b.position.set(-2.2 + 4.6 * u, 1.9 + Math.sin(t * Math.PI) * 2.4, 0.3 - 0.7 * u); });
  updateParts(dt, viewDist); updateAmbient(dt, stageAt(viewDist).id);
  rim.position.set(camX + 3, 8, -16); rim.target.position.set(camX, 1, 0);
  FLAMES.forEach((f, i) => { const k = 1 + Math.sin(time * 17 + i * 2.1) * 0.12 + Math.sin(time * 29 + i) * 0.06; f.scale.set(1 / k, k, 1 / k); });
  // the sun (and its shadow area) follows the runner
  sun.position.set(camX - 9, 24, 8); sun.target.position.set(camX, 0, -14);

  // bear
  const showBear = state !== 'title' && (bearD < 0.98 || time - lastNear < 2.5);
  bear.visible = showBear;
  if (showBear) {
    bear.position.set(player.xw * 0.9, 0, 1.7 + bearD * 3.2);
    bear.userData.legs.forEach((l, i) => { l.rotation.x = Math.sin(time * 16 + (i % 2 ? Math.PI : 0)) * 0.6; });
  }

  // camera: follows the runner like Subway Surfers, rises when he's on a roof
  camX += (player.xw * 0.8 - camX) * Math.min(1, dt * 6);
  const targetY = 3.3 + Math.max(0, player.h) * 0.55;
  camY += (targetY - camY) * Math.min(1, dt * 5);
  let sx = 0, sy = 0;
  if (shake > 0) { shake = Math.max(0, shake - dt); sx = (Math.random() - 0.5) * shake * 0.6; sy = (Math.random() - 0.5) * shake * 0.6; }
  camKick = Math.max(0, camKick - dt * 0.9);
  camera.position.set(camX + sx, camY + sy - camKick, 6.4);
  camera.lookAt(camX * 0.85, 1.1 + player.h * 0.45, -12);
  const fovT = 62 + (boostT > 0 ? 8 : 0) + Math.min(6, (speed - 12) * 0.4);
  camera.fov += (fovT - camera.fov) * Math.min(1, dt * 3); camera.updateProjectionMatrix();

  // fog and horizon follow the stage
  const sid = stageAt(viewDist).id;
  tmpCol.set(FOG[sid]); fogCol.lerp(tmpCol, Math.min(1, dt * 1.5));
  scene.fog.color.copy(fogCol); scene.background.copy(fogCol);
  scene.fog.near = sid === 'house' ? 40 : 70; scene.fog.far = sid === 'house' ? 140 : 210;
  hemi.intensity = sid === 'house' ? 1.05 : 0.75;
  horizon.position.set(camera.position.x * 0.98, horizon.userData.h / 2 - 10, -380);
  horizon.visible = sid !== 'house' || stageAt(viewDist).end < 40;

  // HUD
  if (state === 'play' || state === 'paused') {
    $('hDist').textContent = Math.floor(dist * 0.5) + ' m'; $('hCoins').textContent = '● ' + coinCount; $('hScore').textContent = score();
    const showB = state === 'play' && (bearD < 1 || time - lastNear < 2.5);
    bearUI.style.display = showB ? 'flex' : 'none';
    $('bearFill').style.width = (bearD * 100) + '%'; $('bearFill').style.background = bearD < 0.35 ? '#D32F2F' : '#C6D62C';
    boostUI.style.display = state === 'play' && boostT > 0 ? 'flex' : 'none';
    if (boostT > 0) boostUI.textContent = 'SPEED BOOST ' + boostT.toFixed(1) + 's';
  }
  cdUI.style.display = state === 'play' && countdown > 0 ? 'flex' : 'none';
  if (countdown > 0) cdUI.textContent = Math.ceil(countdown / 0.5);
}
function rampUnder() { const f = floorAt(player.lane); return f ? f.h : 0; }

// ================= AUTO QUALITY =================
// If a phone can't keep ~40 fps, first drop the render resolution, then the soft shadows.
let qLevel = 0, qTime = 0, qFrames = 0;
function autoQuality(dt) {
  if (state !== 'play' || qLevel >= 3) return;
  qTime += dt; qFrames++;
  if (qTime < 3) return;
  const fps = qFrames / qTime; qTime = 0; qFrames = 0;
  if (fps >= 40) return;
  qLevel++;
  if (qLevel === 1) { useBloom = false; }
  if (qLevel === 2) { renderer.setPixelRatio(1); resize(); }
  if (qLevel === 3) { sun.castShadow = false; }
}

// ================= LOOP =================
let lastTs = 0, idleDist = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000); lastTs = ts;
  if (state === 'play' && !window.__pause) { if (countdown > 0) countdown = Math.max(0, countdown - dt); else update(dt); }
  else if (state === 'title') { idleDist += dt * 10; time += dt; }
  const vd = state === 'title' ? idleDist : dist;
  if (state === 'title') { dist = idleDist; }
  syncScene(dt, vd);
  if (useBloom && composer) composer.render(); else renderer.render(scene, camera);
  if (!window.__t) autoQuality(dt);
}

// ================= BOOT =================
loadImages().then(() => {
  resize();
  buildHorizon(); buildRunner(); buildAmbient(); bear = buildBear(); bear.visible = false; scene.add(bear);
  player = { lane: 1, xw: 0, h: 0, vh: 0, airborne: false, roll: 0, onRamp: false, climb: false, lift: false, ladder: false, sq: 0, wasAir: false };
  rebuildChunks();
  $('loading').remove();
  showTitle();
  requestAnimationFrame(frame);
  /*TEST_HOOK*/
});
</script>
